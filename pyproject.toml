[project]
name = "log-investigator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "cryptography>=50.0.2",
    "faker>=40.43.0",
    "fastapi>=0.143.1",
    "openai>=3.31.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
log-investigator = "app.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a real MariaDB (set INTEGRATION_DB_URL to enable)"]